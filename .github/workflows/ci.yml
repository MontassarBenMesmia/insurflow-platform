name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -ntp verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  ml-service:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Render and validate Kubernetes resources
        run: |
          kubectl kustomize infra > rendered-kubernetes.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0-alpine \
            -strict -summary -kubernetes-version 1.31.0 < rendered-kubernetes.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0-alpine \
            -strict -summary -kubernetes-version 1.31.0 < infra/kubernetes/secret.example.yaml
      - name: Validate observability configuration
        run: |
          python -m json.tool infra/observability/grafana/dashboards/insurflow-platform.json > /dev/null
          docker run --rm \
            -v "$PWD/infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml
      - name: Validate Compose configuration
        run: docker compose --profile observability config --quiet

  containers:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component:
          - {name: backend, context: backend}
          - {name: frontend, context: frontend}
          - {name: risk-service, context: ml-service}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          push: false
          tags: insurflow-${{ matrix.component.name }}:ci
