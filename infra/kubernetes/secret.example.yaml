apiVersion: v1
kind: Secret
metadata:
  name: insurflow-secrets
  namespace: insurflow
type: Opaque
stringData:
  POSTGRES_USER: insurflow
  POSTGRES_PASSWORD: replace-with-a-long-random-password
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: replace-with-a-different-long-random-password
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: replace-with-a-third-long-random-password
