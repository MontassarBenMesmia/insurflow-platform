spring:
  application:
    name: insurflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurflow}
    username: ${DB_USERNAME:insurflow}
    password: ${DB_PASSWORD:insurflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/insurflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/insurflow/protocol/openid-connect/certs}

server:
  port: 8080
  error:
    include-message: never

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  risk-service:
    base-url: ${RISK_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
