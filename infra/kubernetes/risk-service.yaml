apiVersion: v1
kind: Service
metadata:
  name: risk-service
spec:
  selector:
    app.kubernetes.io/name: risk-service
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-service
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: risk-service
          image: ghcr.io/montassarbenmesmia/insurflow-risk-service:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
