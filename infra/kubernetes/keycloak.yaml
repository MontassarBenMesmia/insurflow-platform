apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.2.4
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: jdbc:postgresql://postgres:5432/keycloak}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: insurflow-secrets, key: POSTGRES_USER}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: insurflow-secrets, key: POSTGRES_PASSWORD}}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: insurflow-secrets, key: KEYCLOAK_ADMIN}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: insurflow-secrets, key: KEYCLOAK_ADMIN_PASSWORD}}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
