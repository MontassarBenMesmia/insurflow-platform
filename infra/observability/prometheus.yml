global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: insurflow-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]

  - job_name: insurflow-risk
    metrics_path: /metrics
    static_configs:
      - targets: [risk-service:8000]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
